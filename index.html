<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A Pokémon autobattler roguelike with PMD sprites.">
<title>PokéRun Tactics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one fixed 1280x720 stage, letterboxed and scaled; canvas board in the middle, GBA-style windows for HUD, traits and shop. Single dark-forest look on purpose. */
:root{
  --night:#13201a;      /* page backdrop around the stage */
  --ink:#24303d;        /* window text and outer frame */
  --paper:#f7f6ee;      /* window fill */
  --frame:#5b86a8;      /* window inner frame (GBA blue) */
  --frame-lt:#a9cde3;
  --gold:#f5c645;
  --ball:#e2433f;
  --great:#3d79d6;
  --ultra:#2b2b2f;
  --muted:#6c7884;
  --leaf:#5bab48;
  --display:"PokeEmerald", "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --label:"PokeEmerald", "Pixelify Sans", "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;}
[hidden]{display:none!important;}
body{background:var(--night);color:var(--paper);overflow:hidden;font-family:var(--display);}
#wrap{position:fixed;inset:0;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  background:radial-gradient(ellipse at 50% 40%,#1d3326 0%,var(--night) 70%);}
#stage{position:relative;width:1280px;height:720px;transform-origin:center center;flex:none;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px #0009;user-select:none;-webkit-user-select:none;touch-action:none;}
#cv{position:absolute;inset:0;width:1280px;height:720px;image-rendering:pixelated;}

/* GBA window */
.win{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:10px;
  box-shadow:inset 0 0 0 3px var(--frame-lt),inset 0 0 0 5px var(--paper),inset 0 0 0 6px var(--frame),0 4px 0 #0005;}
.lbl{font-family:var(--label);font-size:16px;text-transform:uppercase;color:var(--muted);}

/* HUD */
#hud{position:absolute;left:14px;right:14px;top:12px;height:64px;display:flex;gap:12px;align-items:stretch;pointer-events:none;}
#hud .win{padding:8px 14px;display:flex;align-items:center;gap:12px;pointer-events:auto;}
#trainer{min-width:236px;}
#trainer .ball{width:28px;height:28px;flex:none;}
.hpbar{width:120px;height:10px;border:2px solid var(--ink);border-radius:6px;background:#3a3f45;overflow:hidden;}
.hpbar i{display:block;height:100%;background:linear-gradient(#7fe07a,#45b33f);transition:width .4s;}
.hpbar.mid i{background:linear-gradient(#ffe066,#e8b420);} .hpbar.low i{background:linear-gradient(#ff8a7a,#e0453a);}
.num{font-size:16px;font-variant-numeric:tabular-nums;}
#floors{flex:1;justify-content:center;flex-direction:column;gap:2px !important;padding:6px 14px !important;}
#floors .act{font-family:var(--label);font-size:16px;color:var(--muted);text-transform:uppercase;display:flex;gap:10px;align-items:center;}
#floors .act b{color:var(--ink);}
#track{display:flex;align-items:center;gap:0;margin-top:9px;}
.node{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);background:#dfe6ea;display:grid;place-items:center;position:relative;flex:none;}
.node svg{width:12px;height:12px;}
.node.done{background:#9fb3a1;opacity:.75;}
.node.lost{background:#d79a92;opacity:.75;}
.node.cur{transform:scale(1.25);box-shadow:0 0 0 3px var(--gold);z-index:1;}
.node.pb{background:linear-gradient(var(--ball) 0 46%,var(--ink) 46% 56%,#fff 56%);}
.node.pb::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff;border:2px solid var(--ink);position:absolute;}
.node.elite{background:linear-gradient(var(--great) 0 46%,var(--ink) 46% 56%,#fff 56%);}
.node.elite::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff;border:2px solid var(--ink);position:absolute;}
.node.boss{width:28px;height:28px;background:#f3d27a;overflow:hidden;}
.node.boss img{width:100%;height:100%;image-rendering:pixelated;}
.node.aug::before{content:"";position:absolute;bottom:-12px;left:50%;width:8px;height:8px;margin-left:-4px;transform:rotate(45deg);background:linear-gradient(135deg,#ff8de1,#8ad8ff,#ffe27a);border:1.5px solid var(--ink);}
.link{width:10px;height:3px;background:var(--ink);opacity:.35;flex:none;}
#goldbox .coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,var(--gold) 55%,#b98a14);border:2px solid var(--ink);display:grid;place-items:center;font-size:16px;}
#teambox .num small{font-size:16px;color:var(--muted);}
.btn-speed{font-family:var(--label);font-size:16px;border:2px solid var(--ink);background:#fff;border-radius:6px;padding:3px 8px;cursor:pointer;color:var(--ink);}
.btn-speed[aria-pressed="true"]{background:var(--gold);}

/* Traits */
#traits{position:absolute;left:14px;top:90px;width:196px;display:flex;flex-direction:column;gap:6px;}
.trait{display:flex;align-items:center;gap:8px;background:#0f1c15cc;border:2px solid #0008;border-radius:8px;padding:5px 8px 5px 5px;color:#e9efe6;}
.trait .hex{width:30px;height:34px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;background:#55606a;flex:none;}
.trait .hex svg{width:16px;height:16px;fill:#fff;}
.trait .hex span{font-family:var(--label);font-size:16px;color:#fff;}
.trait.t1 .hex{background:linear-gradient(#d8955a,#9a5a2c);} .trait.t2 .hex{background:linear-gradient(#ffe48a,#d9a521);}
.trait .nm{font-size:16px;line-height:1.05;}
.trait .bp{font-family:var(--label);font-size:16px;color:#8d9a92;}
.trait .bp b{color:#fff;}
.trait.off{opacity:.62;}
.trait .ct{margin-left:auto;font-size:16px;font-variant-numeric:tabular-nums;}
#traits .hint{font-family:var(--label);font-size:16px;color:#b5c7b9;opacity:.7;padding:2px 4px;line-height:1.5;}

/* Run modifiers */
#mods{position:absolute;right:14px;top:90px;width:200px;display:flex;flex-direction:column;gap:6px;}
.mod{background:#0f1c15cc;border:2px solid #0008;border-radius:8px;padding:6px 9px;color:#e9efe6;cursor:default;}
.mod .k{font-family:var(--label);font-size:16px;color:#9fb5a6;text-transform:uppercase;}
.mod .v{font-size:16px;}
.mod.silver{border-color:#c9d3dc;} .mod.gold{border-color:var(--gold);} .mod.prismatic{border-image:linear-gradient(135deg,#ff8de1,#8ad8ff,#ffe27a) 1;}
.mod p{margin:2px 0 0;font-size:16px;line-height:1.3;color:#c9d6cc;}

/* Shop */
#shop{position:absolute;left:14px;right:14px;bottom:10px;height:146px;display:flex;gap:12px;padding:10px 12px;align-items:stretch;}
#shop.sell{background:#ffe9e4;}
#shop .side{width:150px;display:flex;flex-direction:column;gap:8px;justify-content:center;}
.btn{font-family:var(--display);font-size:16px;border:3px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);padding:8px 12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 0 var(--ink);position:relative;}
.btn:hover:not(:disabled){background:#fff8d6;}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink);}
.btn:disabled{opacity:.45;cursor:default;}
.btn:focus-visible,.card:focus-visible,.pick:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.btn.go{background:var(--ball);color:#fff;font-size:24px;}
.btn.go:hover:not(:disabled){background:#f05a50;}
.cards{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;min-width:0;}
.card{position:relative;border:3px solid var(--ink);border-radius:8px;background:#fff;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;color:var(--ink);text-align:left;padding:0;font-family:var(--display);}
.card .band{height:30px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 8px;color:#fff;font-size:16px;}
.card.c1 .band{background:linear-gradient(var(--ball),#c42f2c);} .card.c2 .band{background:linear-gradient(#4f8be6,#2d62b8);} .card.c3 .band{background:linear-gradient(#3b3b42,#1e1e22);}
.card.c3 .band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--gold) 0 22%,transparent 22% 78%,var(--gold) 78%);}
.card .band span{position:relative;z-index:1;text-shadow:0 2px 0 #0006;}
.card .band .cost{display:flex;align-items:center;gap:4px;}
.card .body{display:flex;gap:8px;padding:6px 8px;align-items:center;flex:1;}
.card .por{width:64px;height:64px;border:2px solid var(--ink);border-radius:6px;image-rendering:pixelated;background:#e8efe2;flex:none;}
.card .info{display:flex;flex-direction:column;gap:4px;min-width:0;}
.card .role{font-family:var(--label);font-size:16px;color:var(--muted);text-transform:uppercase;}
.card:hover:not(.empty){transform:translateY(-3px);box-shadow:0 4px 0 var(--ink);}
.card.empty{background:repeating-linear-gradient(135deg,#eef0ea 0 8px,#e3e7df 8px 16px);cursor:default;}
.card.poor{filter:grayscale(.6);opacity:.7;}
.card.owned::after{content:"";position:absolute;inset:0;border:3px solid var(--gold);border-radius:5px;pointer-events:none;box-shadow:inset 0 0 12px #f5c64588;}
.chips{display:flex;gap:4px;flex-wrap:wrap;}
.chip{font-family:var(--label);font-size:16px;padding:2px 5px;border-radius:4px;color:#fff;border:1.5px solid #0006;text-transform:uppercase;}
.sellzone{position:absolute;inset:0;display:none;place-items:center;font-size:32px;color:var(--ball);border-radius:8px;background:#fff1eecc;z-index:2;}
#shop.sell .sellzone{display:grid;}

/* Tooltip */
#tip{position:absolute;width:290px;padding:12px 14px;pointer-events:none;z-index:50;display:none;font-size:16px;}
#tip .top{display:flex;gap:10px;align-items:center;}
#tip img{width:80px;height:80px;image-rendering:pixelated;border:2px solid var(--ink);border-radius:6px;background:#e8efe2;}
#tip h3{margin:0;font-size:24px;line-height:1;}
#tip .stars{color:var(--gold);-webkit-text-stroke:1px var(--ink);font-size:16px;letter-spacing:2px;}
#tip .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;margin:10px 0 8px;}
#tip .stats div{display:flex;flex-direction:column;}
#tip .stats b{font-size:16px;font-variant-numeric:tabular-nums;}
#tip .ab{border-top:2px dashed #c5d1d9;padding-top:8px;}
#tip .ab b{font-size:16px;}
#tip .ab p{margin:3px 0 0;line-height:1.35;}

/* Overlays */
#overlay{position:absolute;inset:0;z-index:30;display:grid;place-items:center;}
#overlay:empty{display:none;}
.scrim{position:absolute;inset:0;background:#0b140fb3;}
.screen{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;}
.logo{font-family:var(--display);font-size:96px;line-height:.9;color:#ffcb05;letter-spacing:2px;
  text-shadow:0 0 0 #2a5aa8,4px 0 0 #2a5aa8,-4px 0 0 #2a5aa8,0 4px 0 #2a5aa8,0 -4px 0 #2a5aa8,4px 4px 0 #2a5aa8,-4px 4px 0 #2a5aa8,4px -4px 0 #2a5aa8,-4px -4px 0 #2a5aa8,0 10px 0 #17305c,4px 10px 0 #17305c,-4px 10px 0 #17305c;}
.logo small{display:block;text-align:center;font-size:48px;color:#fff;margin-top:10px;}
.tag{font-family:var(--label);color:#d8ead9;font-size:16px;text-transform:uppercase;text-shadow:0 2px 0 #000;}
.credit{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-family:var(--label);font-size:16px;color:#cfe0d2;opacity:.8;}
.credit a{color:#fff;}
.h1{font-size:32px;color:#fff;text-shadow:0 3px 0 #000a;margin:0;}
.sub{font-size:16px;color:#d3e4d6;margin:-8px 0 6px;max-width:640px;text-align:center;line-height:1.4;text-wrap:balance;}
.picks{display:flex;gap:18px;}
.pick{width:300px;padding:18px 18px 16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;font-family:var(--display);font-size:16px;transition:transform .12s;}
.pick:hover{transform:translateY(-6px);}
.pick h2{margin:0;font-size:24px;line-height:1;}
.pick p{margin:0;line-height:1.4;}
.pick .por3{display:flex;gap:6px;}
.pick .por3 img{width:56px;height:56px;image-rendering:pixelated;border:2px solid var(--ink);border-radius:6px;background:#e8efe2;}
.pick ul{margin:0;padding-left:18px;line-height:1.45;}
.pick .guide{font-family:var(--label);font-size:16px;color:var(--muted);text-transform:uppercase;border-top:2px dashed #c5d1d9;padding-top:8px;}
.pick.aug{width:260px;align-items:center;text-align:center;}
.pick.aug .gem{width:64px;height:64px;transform:rotate(45deg);border:3px solid var(--ink);margin:10px 0;}
.tier-silver .gem{background:linear-gradient(135deg,#ffffff,#b8c4cf 60%,#8293a3);}
.tier-gold .gem{background:linear-gradient(135deg,#fff4b8,#f5c645 55%,#b98a14);}
.tier-prismatic .gem{background:linear-gradient(135deg,#ff9be6,#9fe0ff 35%,#fff08a 65%,#b8a0ff);animation:prism 2.4s linear infinite;}
@keyframes prism{to{filter:hue-rotate(360deg);}}
.tier-silver{box-shadow:inset 0 0 0 3px #d9e1e8,inset 0 0 0 5px var(--paper),inset 0 0 0 6px #8293a3,0 4px 0 #0005;}
.tier-gold{box-shadow:inset 0 0 0 3px #ffe48a,inset 0 0 0 5px var(--paper),inset 0 0 0 6px #c9961d,0 4px 0 #0005;}
.tier-prismatic{box-shadow:inset 0 0 0 3px #ffc3f0,inset 0 0 0 5px var(--paper),inset 0 0 0 6px #8a6ce0,0 4px 0 #0005;}
.tierbanner{font-family:var(--label);font-size:16px;padding:6px 16px;border-radius:6px;border:2px solid #000a;color:var(--ink);}
.tierbanner.silver{background:linear-gradient(#fff,#b8c4cf);} .tierbanner.gold{background:linear-gradient(#fff4b8,#e6b22c);} .tierbanner.prismatic{background:linear-gradient(90deg,#ff9be6,#9fe0ff,#fff08a,#b8a0ff);}
.banner{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);padding:14px 40px;font-size:48px;text-align:center;z-index:25;pointer-events:none;animation:pop .35s ease-out;}
.banner small{display:block;font-size:16px;font-weight:500;color:var(--muted);}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}
#toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);padding:8px 16px;font-size:16px;z-index:26;pointer-events:none;display:none;}
.loading{font-family:var(--label);color:#fff;}
.endstat{display:flex;gap:28px;font-size:16px;}
.endstat div{display:flex;flex-direction:column;align-items:center;}
.endstat b{font-size:32px;}
.acts{display:flex;gap:12px;}
.acts .win{padding:10px 14px;width:190px;font-size:16px;}
.acts .lock{opacity:.6;}

/* --- v2 additions --- */
.card.c4 .band{background:linear-gradient(#3f6e3a,#203d1d);}
.card.c4 .band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:#f08a2c;}
.card.c5 .band{background:linear-gradient(#9356d6,#5a2898);}
.card.c5 .band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:radial-gradient(circle at 25% 50%,#ff8ad2 0 3px,transparent 3.5px),radial-gradient(circle at 75% 50%,#ff8ad2 0 3px,transparent 3.5px);}
.card .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;}
#traits{gap:4px;max-height:450px;overflow:hidden;}
.trait{padding:3px 8px 3px 4px;gap:7px;}
.trait .hex{width:28px;height:32px;background:#55606a;}
.trait.t1 .hex{background:linear-gradient(#e3a06a,#9a5a2c);} .trait.t2 .hex{background:linear-gradient(#fff0a8,#d9a521);}
.trait .hex .in{width:22px;height:26px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;font-family:var(--label);font-size:16px;color:#fff;text-shadow:0 1px 0 #0008;letter-spacing:0;}
.trait.off .hex .in{filter:saturate(.35) brightness(.8);}
.trait .nm{font-size:16px;}
.trait .ct{font-size:16px;}
.more{font-family:var(--label);font-size:16px;color:#b5c7b9;padding:2px 6px;}
.modes{display:grid;grid-template-columns:repeat(3,1fr) 1.15fr;grid-auto-rows:auto;gap:12px;width:1060px;}
.mode{padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;font-family:var(--display);transition:transform .12s;}
.mode:hover{transform:translateY(-4px);}
.mode h2{margin:0;font-size:24px;line-height:1;}
.mode .row{display:flex;gap:4px;}
.mode .row img{width:44px;height:44px;image-rendering:pixelated;border:2px solid var(--ink);border-radius:5px;background:#e8efe2;}
.mode .meta{font-family:var(--label);font-size:16px;color:var(--muted);text-transform:uppercase;}
.mode.nat{grid-column:4;grid-row:1 / span 3;justify-content:center;gap:10px;padding:18px;box-shadow:inset 0 0 0 3px #ffc3f0,inset 0 0 0 5px var(--paper),inset 0 0 0 6px #8a6ce0,0 4px 0 #0005;}
.mode.nat h2{font-size:32px;}
.mode.nat p{margin:0;font-size:16px;line-height:1.4;}
.mode .grid5{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.mode .grid5 img{width:100%;aspect-ratio:1;image-rendering:pixelated;border:2px solid var(--ink);border-radius:6px;background:#e8efe2;}
.mode .best{margin-left:auto;font-family:var(--label);font-size:16px;color:var(--leaf);}
.evo{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:1000px;}
.evo .pick{width:170px;align-items:center;text-align:center;padding:14px;}
.evo .pick img{width:80px;height:80px;image-rendering:pixelated;border:2px solid var(--ink);border-radius:6px;background:#e8efe2;}
.evo .pick h2{font-size:16px;}
.back{position:absolute;top:18px;left:18px;font-size:16px;padding:6px 12px;}

/* --- v3: items, bag, chests, levels --- */
#shop .side{gap:6px;}
.btn.sm{font-size:16px;padding:6px 10px;}
.btn.go{padding:8px 12px;}
#teambox{min-width:96px;}
.xpbar{width:72px;height:6px;border:2px solid var(--ink);border-radius:4px;background:#3a3f45;overflow:hidden;margin-top:2px;}
.xpbar i{display:block;height:100%;background:linear-gradient(#9fd4ff,#3d8be0);transition:width .3s;}
#traits{max-height:282px;}
#bag{position:absolute;left:14px;top:378px;width:196px;padding:8px 10px 6px;display:flex;flex-direction:column;gap:6px;}
.baghead{display:flex;justify-content:space-between;}
.slots{display:grid;grid-template-columns:repeat(5,32px);gap:4px;justify-content:space-between;}
.slot{width:32px;height:32px;box-sizing:border-box;border:2px solid #c5d1d9;border-radius:6px;background:#eef2f4;display:grid;place-items:center;padding:0;cursor:grab;touch-action:none;}
.slot img{width:28px;height:28px;image-rendering:pixelated;pointer-events:none;}
.slot.empty{cursor:default;background:repeating-linear-gradient(135deg,#eef0ea 0 4px,#e3e7df 4px 8px);}
.t-common{border-color:#98a4ae;} .t-rare{border-color:#3d79d6;background:#e7f0ff;} .t-epic{border-color:#c9961d;background:#fff4d6;} .t-use{border-color:#4d9a3a;background:#e9f7e3;} .t-relic{border-color:#8a6ce0;background:#f1ebff;}
.baghint{font-family:var(--label);font-size:16px;color:var(--muted);text-transform:uppercase;}
#ghost{position:absolute;width:44px;height:44px;image-rendering:pixelated;pointer-events:none;z-index:40;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 0 #0006);}
.relics{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.relics img{width:26px;height:26px;image-rendering:pixelated;background:#f1ebff;border:2px solid #8a6ce0;border-radius:6px;}
.pick.item{width:230px;align-items:center;text-align:center;}
.pick.item .icon{width:76px;height:76px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:12px;background:#eef2f4;}
.pick.item .icon img{width:60px;height:60px;image-rendering:pixelated;}
.pick.item .tier{font-family:var(--label);font-size:16px;text-transform:uppercase;padding:2px 8px;border-radius:4px;color:#fff;}
.tier.common{background:#7d8892;} .tier.rare{background:#3d79d6;} .tier.epic{background:#c9961d;} .tier.use{background:#4d9a3a;} .tier.relic{background:#8a6ce0;}
.pick.item.p-rare .icon{background:#e7f0ff;border-color:#3d79d6;} .pick.item.p-epic .icon{background:#fff4d6;border-color:#c9961d;} .pick.item.p-relic .icon{background:#f1ebff;border-color:#8a6ce0;} .pick.item.p-use .icon{background:#e9f7e3;border-color:#4d9a3a;}
.skip{margin-top:4px;}
#tip .recipes img{width:20px;height:20px;border:0;border-radius:0;background:none;}

.s-atk{color:#d0661e;} .s-spa{color:#7a4fd8;} .s-hp{color:#2f8f3a;} .s-def{color:#a8781a;} .s-as{color:#b98a00;} .s-true{color:#24303d;text-decoration:underline;}

.oddstab{position:absolute;right:14px;top:-26px;height:26px;padding:0 10px;border:3px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0;background:var(--paper);display:flex;align-items:center;gap:8px;font-family:var(--label);font-size:16px;box-shadow:inset 0 3px 0 var(--frame-lt);}
.od{color:var(--ink);} .od b{font-weight:normal;}
.od.c1{color:#c42f2c;} .od.c2{color:#2d62b8;} .od.c3{color:#1e1e22;} .od.c4{color:#3f6e3a;} .od.c5{color:#7a35c0;}
.od.off{opacity:.3;}
.sts{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.stp{font-family:var(--label);font-size:16px;color:#fff;padding:1px 6px;border-radius:4px;border:1.5px solid #0006;text-transform:uppercase;}
.evo .pick.cur{box-shadow:inset 0 0 0 3px var(--gold),0 4px 0 #0005;}
/* controller cursor hover = same look as mouse hover / keyboard focus */
.mi.padhover{background:#e9eef7;}
.mi.padhover::before{content:"";position:absolute;left:10px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:12px solid var(--ink);border-right:0;}
.btn.padhover:not(:disabled){background:#fff8d6;}
.btn.go.padhover:not(:disabled){background:#f05a50;}
.card.padhover:not(.empty){transform:translateY(-3px);box-shadow:0 4px 0 var(--ink);}
.pick.padhover,.mode.padhover{transform:translateY(-4px);outline:3px solid var(--gold);outline-offset:2px;}
.srow.padhover,.stab.padhover:not([aria-selected="true"]){background:#e9eef7;}
.slot.padhover,.sarr.padhover,.mcard.padhover,.btn-speed.padhover,.shoptog.padhover,.baghead.padhover,.trait.padhover,.cap.padhover{outline:3px solid var(--gold);outline-offset:1px;}
.btn:hover:not(:disabled),.btn.padhover:not(:disabled),.btn:focus-visible{box-shadow:0 3px 0 var(--ink),0 0 0 3px var(--gold);}
#overlay [data-craft]{cursor:help;border-radius:4px;}
#overlay [data-craft]:hover,#overlay [data-craft].padhover{background:#e9eef7;outline:2px solid var(--gold);}
/* set medals */
.trait.m-bronze .hex{background:linear-gradient(#e3a06a,#9a5a2c);}
.trait.m-silver .hex{background:linear-gradient(#f2f6fa,#9aa7b4);}
.trait.m-gold .hex{background:linear-gradient(#fff0a8,#d9a521);}
.trait.m-prism .hex{background:linear-gradient(135deg,#ff8de1,#8ad8ff 35%,#ffe27a 65%,#9dff9a);animation:prism 3s linear infinite;background-size:200% 200%;}
.trait.m-prism{border-color:#ffd0f4;box-shadow:0 0 10px #ff8de188;}
@keyframes prism{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
/* unit menu */
.umwin{display:grid;grid-template-columns:330px 300px;gap:18px;padding:16px 18px;max-height:640px;}
.umdetails{font-size:16px;max-height:600px;overflow:auto;}
.umdetails img{width:80px;height:80px;image-rendering:pixelated;border:2px solid var(--ink);border-radius:6px;background:#e8efe2;}
.umdetails .top{display:flex;gap:10px;align-items:center;} .umdetails h3{margin:0;font-size:24px;}
.umdetails .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;margin:10px 0 8px;} .umdetails .stats div{display:flex;flex-direction:column;}
.umside{display:flex;flex-direction:column;gap:6px;}
.umslot{display:flex;align-items:center;gap:10px;border:2px solid #c5d1d9;border-radius:8px;padding:6px 8px;background:#fff;font-size:16px;cursor:help;}
.umslot img{width:32px;height:32px;image-rendering:pixelated;}
.umslot.empty{background:repeating-linear-gradient(135deg,#eef0ea 0 6px,#e3e7df 6px 12px);color:var(--muted);cursor:default;min-height:36px;}
.umslot.t-epic{border-color:#c9961d;background:#fff4d6;} .umslot.t-gear{border-color:#8a6ce0;background:#f1ebff;} .umslot.t-enh{border-color:#2fb8a0;}
.umslot.gim{border-color:#ff7ad9;background:#fff0fa;}
.umacts{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:12px;}
</style>
